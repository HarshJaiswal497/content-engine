# App screens available to videos (files in assets/screens/<app>/<slug>.png, added with tools/add_screens.py).
# Use in a slide:   screen: today            (or "slipnote/composer" if the name exists in both apps; plain names use the post's app)
# Optional zoom:    focus: start-button      (a region below, or a box {x, y, w, h} as fractions 0-1 of the screen)
#                   label: Tap to start      (a small pill that points at the focus)
# Only screens showing features Harsh has cleared are listed here. This file and the images are public.
setalytix:
  today:
    shows: Today tab with the next workout card (Push), exercise list and the Start workout button
    regions: {card: {x: .04, y: .24, w: .92, h: .38}, start-button: {x: .05, y: .645, w: .9, h: .075}}
  today-no-split:
    shows: Today before any split exists, with "Pick a starter" and "Build my own"
    regions: {pick-starter: {x: .09, y: .205, w: .55, h: .065}}
  today-cardio:
    shows: Today with the cardio weekly-minutes card under the next workout
    regions: {cardio-card: {x: .04, y: .86, w: .92, h: .13}}
  welcome:
    shows: New-user welcome with the starter splits (Push/Pull/Legs, Upper/Lower, Full Body)
    regions: {starters: {x: .04, y: .41, w: .92, h: .32}}
  workout-logging:
    shows: Logging a set with the rest timer running, a green target box and ticked sets
    regions: {target: {x: .07, y: .31, w: .86, h: .12}, ticks: {x: .6, y: .44, w: .32, h: .2}, rest-timer: {x: .05, y: .895, w: .9, h: .09}}
  workout-targets:
    shows: A workout before logging, with the target pre-filled and empty set circles
    regions: {target: {x: .07, y: .31, w: .86, h: .12}}
  splits:
    shows: Splits list with the active Push Pull Legs split
    regions: {active-split: {x: .04, y: .175, w: .92, h: .085}}
  edit-split:
    shows: Editing a split's days and exercises
    regions: {exercise: {x: .04, y: .255, w: .92, h: .17}}
  exercises:
    shows: Built-in exercise list with weight steps
    regions: {list: {x: .04, y: .2, w: .92, h: .4}}
  cardio-setup:
    shows: Cardio tab with the weekly goal and weekly plan
    regions: {goal: {x: .04, y: .15, w: .92, h: .18}}
  how-it-works:
    shows: The in-app guide, "Every workout, in 3 steps"
    regions: {steps: {x: .04, y: .15, w: .92, h: .45}}
