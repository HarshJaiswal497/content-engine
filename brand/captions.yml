# Auto-captions on talking-head clips and recordings.
# vocabulary: names the speech model should expect (helps it spell them right).
# fixes: words it still gets wrong → what the caption should say. Keys can be one or two words.
vocabulary: [Setalytix, Slipnote, Flutter, Supabase]
fixes:
  satellitics: Setalytix
  satellytics: Setalytix
  satelytics: Setalytix
  setalytics: Setalytix
  setalitics: Setalytix
  set analytics: Setalytix
  slip note: Slipnote
  slipnotes: Slipnote
