name: Skit test (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  skit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: AnimMouse/setup-ffmpeg@v1
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: echo "HYPERFRAMES_BROWSER_PATH=$(command -v google-chrome || command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt -r requirements-video.txt
      - run: |
          sudo apt-get install -y -q espeak-ng >/dev/null
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts soundfile "kokoro>=0.9"
      - env:
          VOICE_PRIVATE_KEY: ${{ secrets.VOICE_PRIVATE_KEY }}
        run: python tools/skit_test.py samples/skit-${{ github.run_id }}.mp4
      - name: Save to the voice-samples branch
        run: |
          git config user.name "content-engine[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin voice-samples && git checkout -q -B voice-samples origin/voice-samples || git checkout -q --orphan voice-samples
            git rm -rq --cached . >/dev/null 2>&1 || true
            git add -f samples && git commit -qm "skit sample" && git push -q origin voice-samples && break || sleep $((RANDOM % 10 + 3))
          done
