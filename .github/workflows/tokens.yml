name: Keep tokens fresh

# Weekly: refresh the Instagram token (valid 60 days) and warn before the LinkedIn one expires.
on:
  schedule:
    - cron: "30 3 * * 1"   # Mondays 09:00 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt

      - name: Refresh Instagram token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          python -m engine.tokens ig-refresh --out new_token.txt
          if [ -s new_token.txt ]; then
            if [ -n "$GH_TOKEN" ]; then
              gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < new_token.txt
              echo "Saved refreshed token to the IG_ACCESS_TOKEN secret"
            else
              echo "::warning::SECRETS_PAT not set, so the refreshed Instagram token couldn't be saved. See SETUP.md step 6."
            fi
            rm -f new_token.txt
          fi

      - name: Check SECRETS_PAT expiry
        env:
          PAT: ${{ secrets.SECRETS_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then echo "SECRETS_PAT not set; skipping"; exit 0; fi
          EXP=$(curl -sI -H "Authorization: Bearer $PAT" "https://api.github.com/repos/$GITHUB_REPOSITORY" \
                | tr -d '\r' | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')
          if [ -z "$EXP" ]; then echo "SECRETS_PAT has no expiry (or it's already invalid)"; exit 0; fi
          DAYS=$(( ( $(date -d "$EXP" +%s) - $(date +%s) ) / 86400 ))
          echo "SECRETS_PAT expires $EXP (~$DAYS days)"
          if [ "$DAYS" -le 14 ]; then
            OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label pat-expiring --state open --json number -q 'length')
            if [ "$OPEN" = "0" ]; then
              gh label create pat-expiring --repo "$GITHUB_REPOSITORY" --color D93F0B 2>/dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" --label pat-expiring \
                --title "🔑 SECRETS_PAT expires in $DAYS days — replace it (5 min)" \
                --body "Generate a new fine-grained token (repo: content-engine, permission: Secrets read & write) at https://github.com/settings/personal-access-tokens/new and paste it into the SECRETS_PAT repo secret. Without it, the weekly Instagram token renewal can't save, and Instagram posting stops about 60 days later. Close this issue when done."
            fi
          fi

      - name: Check LinkedIn token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: python -m engine.tokens linkedin-check
