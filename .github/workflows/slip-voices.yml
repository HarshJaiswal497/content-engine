name: Slip voices (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          sudo apt-get install -y -q espeak-ng >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9" soundfile
      - run: python tools/slip_voices.py samples
      - name: Save to the voice-samples branch
        run: |
          for f in samples/*.wav; do ffmpeg -loglevel error -i "$f" -b:a 96k "${f%.wav}.mp3" && rm "$f"; done
          git config user.name "content-engine[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin voice-samples && git checkout -q -B voice-samples origin/voice-samples || git checkout -q --orphan voice-samples
            git rm -rq --cached . >/dev/null 2>&1 || true
            git add -f samples && git commit -qm "slip voice samples" && git push -q origin voice-samples && break || sleep $((RANDOM % 10 + 3))
          done
