name: Publish due posts

# Publish approved posts (= post files on main) when their time comes.
# GitHub often runs schedules hours late on free repos, so each run stays awake for up to ~5.5 h:
# it publishes what's due, sleeps until the next post (re-checking main every 30 min), and repeats.
# The next scheduled run picks up when this one ends.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't post anything)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Publish (and stay awake for upcoming posts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOCKED_TERMS: ${{ secrets.BLOCKED_TERMS }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YOUTUBE_MODE: ${{ vars.YOUTUBE_MODE || 'handoff' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          git config user.name "content-engine[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          save_log() {
            git add published
            if ! git diff --cached --quiet; then
              git commit -q -m "Publish log [skip render]"
              for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break || sleep 5; done
            fi
          }
          if [ "${{ inputs.dry_run }}" = "true" ]; then python -m engine.publish --dry-run; exit 0; fi
          deadline=$((SECONDS + 330*60))
          status=0
          while :; do
            python -m engine.publish || status=1
            save_log
            next=$(python -m engine.publish --next-due)
            [ "$next" -lt 0 ] && { echo "Nothing else scheduled."; break; }
            wait=$(( next < 300 ? 300 : (next > 1800 ? 1800 : next) ))
            [ $((SECONDS + wait)) -gt $deadline ] && { echo "Next post is after this run's window; the next run will take it."; break; }
            echo "Next post due in ${next}s; checking again in ${wait}s."
            sleep "$wait"
            git pull --rebase -q || true
          done
          exit $status

      - name: Save publish log
        if: always() && !inputs.dry_run
        run: |
          git config user.name "content-engine[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published
          if ! git diff --cached --quiet; then
            git commit -q -m "Publish log [skip render]"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 5; done
          fi
