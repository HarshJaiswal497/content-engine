    - {who: human, pose: happy, text: "That's Slipnote?", seconds: 1.8, other_pose: cheer, sfx: ping}
    - {who: slip, pose: cheer, text: "In development. *Waitlist in bio!*", seconds: 2.8, sfx: ping}
