platform: instagram
format: reel
scheduled_at: '2026-11-12T12:30:00+05:30'
app: slipnote
pillar: product
text: |
  You don't always have time to talk. But you can still let someone know you're thinking of them.

  Slipnote is in development. Waitlist link in bio.

  #slipnote #handwrittennotes #androidapp #buildinpublic #indiedev
video:
