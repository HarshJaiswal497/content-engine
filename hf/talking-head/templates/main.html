<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter", sans-serif; background: {{BG}}; }
    #th-stage { position: absolute; inset: 0; transform-origin: 50% 38%; }
    #th-video { position: absolute; left: 0; top: {{VIDEO_TOP}}px; width: 1080px; height: {{VIDEO_H}}px; object-fit: cover; }
    #th-hook { position: absolute; top: 250px; left: 60px; right: 60px; display: flex; justify-content: center; opacity: 0; }
    #th-hook span { font-weight: 900; font-size: 74px; letter-spacing: -0.02em; line-height: 1.1; text-align: center; padding: 22px 40px; border-radius: 28px; background: {{ACCENT}}; color: {{ON_ACCENT}}; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
    .cap { position: absolute; left: 50px; right: 50px; top: {{CAP_TOP}}px; display: flex; justify-content: center; gap: 0 18px; flex-wrap: wrap; opacity: 0; }
    .cap .cw { font-weight: 900; font-size: 96px; letter-spacing: -0.02em; line-height: 1.1; color: #fff; padding: 2px 18px 8px; border-radius: 18px; text-shadow: 0 5px 18px rgba(0,0,0,.65), 0 0 3px rgba(0,0,0,.9); }
    .ins { position: absolute; width: 300px; height: 650px; right: 28px; top: {{INS_TOP}}px; border-radius: 42px; background: #0d0d10; padding: 9px; box-shadow: 0 30px 80px rgba(0,0,0,.5); opacity: 0; }
    .ins .scr { position: relative; width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: #000; }
    .ins img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
    .ins .ring { position: absolute; border: 6px solid {{ACCENT}}; border-radius: 20px; opacity: 0; box-shadow: 0 0 0 4px rgba(0,0,0,.25); }
    .ins .lab { position: absolute; left: -26px; padding: 12px 22px; border-radius: 16px; background: {{ACCENT}}; color: {{ON_ACCENT}}; font-weight: 900; font-size: 28px; white-space: nowrap; opacity: 0; }
  </style>
  <div id="root" data-composition-id="th" data-width="1080" data-height="1920">
    <div id="th-stage">
      <video id="th-video" src="{{VIDEO_SRC}}" muted playsinline></video>
    </div>
    <div id="th-hook"><span>{{HOOK}}</span></div>
{{CAPS_HTML}}
{{INSERTS_HTML}}
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // punch-in zooms: [time, scale]
    const zooms = {{ZOOMS}};
    zooms.forEach(([t, s]) => tl.to("#th-stage", { scale: s, duration: 0.28, ease: "power2.inOut" }, t));
    // hook
    const hookOn = {{HOOK_ON}};
    if (hookOn) {
      tl.fromTo("#th-hook", { opacity: 0, y: -50, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.15);
      tl.to("#th-hook", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, {{HOOK_END}});
    }
    // captions: each chunk shows for its span; the spoken word gets the accent pill
    const caps = {{CAPS}};
    caps.forEach((c, i) => {
      const el = "#cap" + i;
      tl.set(el, { opacity: 1 }, c.s);
      tl.fromTo(el, { scale: 0.86, y: 18 }, { scale: 1, y: 0, duration: 0.16, ease: "back.out(2.4)" }, c.s);
      tl.set(el, { opacity: 0 }, c.e);
      c.w.forEach((w, j) => {
        const id = "#cap" + i + "w" + j;
        tl.to(id, { backgroundColor: "{{ACCENT}}", color: "{{ON_ACCENT}}", duration: 0.08 }, w[0]);
        tl.to(id, { backgroundColor: "rgba(0,0,0,0)", color: "#ffffff", duration: 0.08 }, w[1]);
      });
    });
    // phone inserts
    const ins = {{INSERTS}};
    ins.forEach((p, i) => {
      const el = "#ins" + i;
      tl.fromTo(el, { opacity: 0, x: 360, rotate: 8 }, { opacity: 1, x: 0, rotate: 0, duration: 0.5, ease: "expo.out" }, p.s);
      if (p.ring) {
        tl.fromTo(el + " .ring", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, p.s + 0.7);
        tl.fromTo(el + " .lab", { opacity: 0, xPercent: -100 }, { opacity: 1, xPercent: -100, duration: 0.3 }, p.s + 0.9);
      }
      tl.to(el, { opacity: 0, x: 360, rotate: 8, duration: 0.35, ease: "power3.in" }, p.e - 0.35);
    });
    window.__timelines["th"] = tl;
  </script>
</template>
