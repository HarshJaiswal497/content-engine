text: |
  I wanted a scrapbook that opens like a real book. It took three tries in one day, and it was worth it.

  Slipnote's photobook has a cover that swings open, pages that turn and two-page spreads. It's in development. Waitlist link in bio.

  #slipnote #photobook #scrapbook #handwrittennotes #androidapp #buildinpublic #indiedev
