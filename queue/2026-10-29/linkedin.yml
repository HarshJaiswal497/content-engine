text: |
  Gyms are terrible places for internet. Basements, thick walls, phones in airplane mode between sets.

  So Setalytix has one rule: logging a set never waits for the network.

  How a set travels:
  1. Tap ✓ and the set is written to IndexedDB on the phone, marked as not yet synced. The screen updates instantly.
  2. A sync loop pushes unsynced rows to Supabase: on start, when the connection returns, after every save, and every 30 seconds.
  3. IDs are created on the phone, so a retried upload overwrites instead of duplicating.
  4. A row is marked synced only if it wasn't edited while its upload was in flight. Otherwise the newer edit would be silently lost.

  Step 4 is my favourite. It's three lines of code, and it's the difference between "works in a demo" and "never loses a set".

  The gap that mattered most, I found by testing on my own phone in airplane mode. Cardio saved fine offline, but the screen didn't say so. Workouts showed "Offline. 2 waiting to sync"; cardio showed nothing. People judge by what they see, so it was fixed the same night.

  #react #supabase #offlinefirst
