text: |
  My portfolio went from the 50s to 82 on phones in mobile Lighthouse, with one push and nothing visual changed.

  The main gain: a scrolling marquee measured its own width on every animation frame, which made the browser recalculate the page layout each time. On a throttled phone profile that was about 700 ms of blocked time. It now measures once, re-measures only when its size changes, and runs only while it's on screen. Two smaller changes: the tagline star's spin pauses off screen, and on phones the 3D carousel loads only when you reach the Work section.

  A caveat I'd rather state: 53 came from lighthouse-metrics.com and 82 from PageSpeed Insights, and they emulate phones a bit differently. The blocking time is now 70 ms; load time barely moved.

  https://portfolio-harsh-jaiswal.pages.dev

  #webperformance #lighthouse #webdev
