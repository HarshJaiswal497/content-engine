text: |
  My portfolio scored 53 on phones in Lighthouse. After three fixes, the live site scores 82 on phones and 100 on desktop.

  Same design, less to download. The three things I cut, in order: the main script (767 KB down to 165 KB, with the 3D carousel loading only when needed), the project videos (phones now get 3.4 MB versions) and the images (1.1 MB down to 0.5 MB).

  I measured first, fixed one thing at a time and measured again. On a phone, the weight is the speed.

  https://portfolio-harsh-jaiswal.pages.dev

  #webperformance #lighthouse #webdev
