text: |
  My portfolio scored 53 on phones. One push got it to 82.

  The main gain was a scrolling marquee that measured its own width on every frame, so the browser recalculated the layout each time. That blocked a throttled phone for about 700 ms. I made it measure once, and the spin on a tagline star now pauses when it's off screen. On phones, the 3D carousel loads only when you reach it.

  (53 is from lighthouse-metrics.com and 82 from PageSpeed Insights, so it's not a perfectly fair comparison.)

  Comment SPEED and I'll send you the 3 fixes with the prompts.

  #webperformance #lighthouse #buildwithai #vibecoding #webdev #aicoding #buildinpublic #indiedev
