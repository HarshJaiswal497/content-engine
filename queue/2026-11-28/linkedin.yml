text: |
  Before my portfolio had any code, it had rules.

  I wrote down the look (dark base, sand text, one marigold accent), the words (products "built", not "shipped"), the facts (every number from me) and a list of ideas I'd already rejected, like phone screenshots in the hero.

  AI follows rules you wrote down and invents the ones you didn't. Short, specific, 4 sections. That list of "no" saved me more arguments than any prompt.

  https://portfolio-harsh-jaiswal.pages.dev

  #aicoding #webdev #buildinpublic
