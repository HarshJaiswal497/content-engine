  script: |
    I was in the middle of a workout, in my own app, and I pressed the back button on my phone. And the whole app just closed.

    My app changes screens without changing the web address, so the phone thought there was nothing to go back to.

    So I fixed it. Now when you open a workout, back takes you to Today, and your workout is still open. You just tap Resume.

    It's a small thing, but it's exactly the kind of thing you only notice when you actually use your own app.

    Setalytix is free. The link's in my bio.
