text: |
  A "2×2" widget is not one shape.

  On one of my test phones, the same 2×2 widget came out wide. On the other, it came out tall. Same grid size, two different boxes. I only found out because I tried two different phones instead of one.

  The fix was to stop trusting the grid size. Slipnote's widget now reads the real size it was given and picks its layout from that.

  Three habits came out of it:
  1. Test on two different phones, not one.
  2. Take the shape from the real size, never from the grid size.
  3. If a layout looks right on your phone, you've checked one phone.

  Slipnote is in development. The waitlist is open: https://harshjaiswal497.github.io/content-engine/slipnote/

  #android #flutter #buildinpublic
