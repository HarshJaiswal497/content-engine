text: |
  My release builds went from 40+ minutes to about 6, and I made the machine slower on purpose.

  I build Slipnote on an 8 GB PC. I'd given the build tool most of the memory (8 GB), and the whole machine slowed to a crawl. Releases took most of an afternoon.

  I gave it less: 3 GB, then 5 GB. After a memory fix in the app too, a release build took 367.8 seconds, about six minutes.

  The lesson: fit the tool to the machine. More memory for a tool is not always faster, because the machine still needs some for itself.

  Slipnote is in development. The waitlist is open: https://harshjaiswal497.github.io/content-engine/slipnote/

  #buildinpublic #android #developerproductivity
