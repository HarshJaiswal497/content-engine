pillar: lessons
text: |
  The first version of Slipnote worked. My own verdict on it: "it lacks motion, interaction, call to actions, it's very static."

  So before building anything else, I stopped and redesigned the whole app. Not in code, on a design canvas. I drew three directions side by side, picked one (a playful scrapbook look), and redrew every screen before I touched the real app again.

  A few things that came out of it:
  • The composer's tools became six real objects on a shelf, instead of square tiles.
  • Reactions became a peel-off sticker sheet, because an icon row "looks boring".
  • Sending a note became a paper plane: it shrinks, pops, and flies away.

  Building the new look took about a day, because every decision had already been made on the canvas.

  The lesson I'm keeping: drawing it first is cheaper than rebuilding it later.

  #flutter #androiddev #buildinpublic
