text: 'Never plan your first app in one week. Mine failed, so I scrapped it for Slipnote, and the app got better.


  A deadline tells you when to stop, not whether the thing works. So I built in phases, and every phase ended with a test on a real phone. I even started with a throwaway test of the riskiest part, so a dead idea would die on day one.


  First App with AI, part 2 of 7. The phase plan template is free, link in my bio. Comment if it helped, or DM me your doubts.


  #buildwithai #vibecoding #aicoding #firstapp #learntocode #appdev #buildinpublic #indiedev'
