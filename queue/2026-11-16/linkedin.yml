text: |
  My app held the same weight for about four weeks, and it was right.

  Episode 2 of letting Setalytix choose my weights. The lift: pec-dec fly. On 10 Oct the app moved me from 24 kg to 29 kg, because I'd hit every rep goal at 24. From then on it held 29 kg, session after session. Most sessions I hit the first set and missed the others by a rep or two.

  It would have been easy for the app to nudge the weight down, or to keep pushing it up. It did neither. It kept the weight the same and kept the rep goal the same, until I'd earned the next step. On 7 Nov my second set finally hit nine reps at 29 kg. The third set still missed by one.

  That's the part I like: the rule isn't clever, it's consistent. "Hold" means "do this again until you've earned the next step", and after a month of following it I trust it more than my own mood in the gym.

  The numbers come from my training log and are approximate, so read them as "about".

  Next episode: the times I overruled it.

  Setalytix (free): https://app.setalytix.in

