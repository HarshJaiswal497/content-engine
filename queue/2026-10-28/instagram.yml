  script: |
    I kept forgetting what I lifted last session.

    So my progress went in a loop. One good day, then a bad one, then another. Nothing tracked, nothing going up.

    So I built myself a spreadsheet that told me what to lift next. And it worked.

    Then I thought: if I need this, a lot of other people probably do too. So I turned it into an app, Setalytix.

    You open your workout, the weights and reps are already filled in, and it tells you when it's time to go heavier. Even with no signal in the gym.

    It's free. The link's in my bio.
