text: |
  A push notification has to carry everything the widget needs.

  In Slipnote, boomerangs (a short bouncing clip) looked broken on the widget until I opened the app. The cause was one missing number in the push. The widget updates while the app is closed, and without that number it couldn't draw the clip correctly.

  The rule I wrote down after: a push must carry everything a widget needs to draw itself. Don't count on the app being open to fill the gap.

  Small bug, clear rule. Slipnote is in development, and the waitlist is open: https://harshjaiswal497.github.io/content-engine/slipnote/

  #android #widgets #buildinpublic
