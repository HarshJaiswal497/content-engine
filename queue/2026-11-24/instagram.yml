text: |
  Update gone wrong mid-workout? A phone can keep a half-updated copy of an app right after a deploy. Setalytix notices when its files fail to load, clears the cached files and reloads once. That's it. Workout data and sign-in aren't touched, and after 10 seconds you get a Refresh button.

  Free at app.setalytix.in, link in bio.

