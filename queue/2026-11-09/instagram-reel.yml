text: |
  Can an app choose your weights? I followed Setalytix's pick on almost every set for about a month. About 400 sets in, here's the catch: when it says go heavier, that first session is the hard one.

  Episode 1. Follow for the next one. Free at app.setalytix.in, link in bio.

  #setalytix #progressiveoverload #gymtracker #workoutlog #buildinpublic #indiedev #gymlife #strengthtraining
