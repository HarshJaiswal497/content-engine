  script: |-
    My first set of themes looked ugly. I'd only swapped the colours on the same screens.

    So I started over, and made each theme a real thing. A fridge door, with magnets and a breeze. A record sleeve, with the record sliding out. An old book's page, with a wax seal.

    Now there are eight, and everyone picks their own in every circle.

    Slipnote is still in development, and the waitlist link is in my bio.
