  script: |
    When I first got Slipnote working, I looked at it and thought: it's very static. No motion, nothing to tap, nothing that makes you want to send a note.

    So I stopped building features. I drew three different designs side by side, picked one, a playful scrapbook look, and redrew every screen before I touched the real app.

    Now sending a note is a little paper plane that flies away. Reactions are stickers you peel off a sheet.

    It's still in development, but if you want to know when it's ready, the waitlist link is in my bio.
