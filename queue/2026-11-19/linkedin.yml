text: |
  A test that renders every screen in every theme found a crash.

  Slipnote has eight themes now, and I didn't want to check each screen by eye. So there's a test that renders every in-circle screen in every theme and checks that the text is readable (4.5:1 contrast, at 1.15 times text size).

  I built it for contrast. It also found a crash: the "Thinking of you" sheet broke on themes that have six colours. It would have hit someone the first time they opened that sheet in that theme. I found it before anyone did, on the day I wrote the test.

  The lesson: if your app has a matrix (screens by themes, by sizes, by languages), test the whole matrix automatically. Looking at three combinations by eye misses the fourth.

  Slipnote is in development. The waitlist is open: https://harshjaiswal497.github.io/content-engine/slipnote/

  #android #flutter #buildinpublic
