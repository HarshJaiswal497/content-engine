text: |
  A bug that only shows up if you delete from the middle.

  In Setalytix I deleted an exercise from a split, then tried to add another. It failed. It kept failing even after the workout ended.

  Each exercise in a split sits in a numbered slot. Deleting one from the middle leaves a gap: slots 0, 1, 2, 4. When I added a new exercise, the app used "how many exercises there are" as the next slot number. That's 4, and slot 4 was already taken.

  It would have hit anyone who removed a middle exercise and then added one.

  The fix: a new exercise goes in the slot after the highest one, not the slot after the count.

  The good news: my workout was never at risk. A running workout uses its own saved copy of the plan, so editing the split can't touch it.

  I also replaced raw database errors with plain sentences like "Could not reach the server" and "Your sign-in has expired", so nobody gets a wall of technical text.

  #webdev #typescript #buildinpublic
