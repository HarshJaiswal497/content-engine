pillar: engineering-deep-dive
text: |
  On day 1 of building Slipnote, I didn't build the app. I built a throwaway test of the one thing that could kill it.

  Slipnote's whole idea is that a note lands on a friend's home-screen widget. If the widget couldn't update while the app was closed, there was no product.

  Two problems:
  • Android widgets can't use custom fonts or draw custom shapes. So the Flutter app paints the entire widget as a PNG, even in a background engine with no screen, and the native Kotlin widget just displays the picture. It's written to a temp file and renamed, so the widget never shows half an image.
  • Phones kill background apps, and my test phone is from a brand known for doing exactly that.

  Results on the real phone:
  → App swiped away: note sent, widget updated in about 6.5 seconds. I repeated it unplugged, because charging can relax background limits.
  → After a restart, without ever opening the app: about 35 seconds.

  Only then did I start the real app. It's now in phase 5 of 10.

  #flutter #androiddev #kotlin
