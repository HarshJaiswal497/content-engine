text: 'Never tell your AI "make it better". Say exactly what stays and what changes.


  My first Today screen showed only a Resume button when a workout was open. I wanted the normal screen, with just Start turning into Resume. And a query for "the newest 20 notes" hid a friend''s note behind mine, until I asked for the newest from others.


  First App with AI, part 3 of 7. Comment PROMPTS and I''ll send you the before-and-after prompts.


  #buildwithai #vibecoding #aicoding #firstapp #learntocode #appdev #buildinpublic #indiedev'
slides:
