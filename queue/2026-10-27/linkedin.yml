text: |
  Before I let anyone else use my workout app, I tested it against my own gym spreadsheet.

  Setalytix's core job is one decision: should you add weight this session, or stay and aim for more reps?

  I'd been making that call myself in a spreadsheet. So my own logs from 30 Sep to 10 Oct became the test: 27 exercises, 9 training days. For every step from one session to the next, does the app make the same call I did?

  It agreed 31 out of 31 times, including all 6 weight increases. The test lives in the codebase, so it fails if a future change ever disagrees.

  A few rules came straight from real training:
  • Warm-up, drop and failure sets never count toward the decision.
  • After a weight increase, it learns how far your reps usually drop, from your last 3 increases.
  • Back after 21+ days off? It repeats your last weight instead of jumping.

  AI helped write the engine. Choosing the rules, and proving them against real data, was the part I had to own.

  #typescript #testing
