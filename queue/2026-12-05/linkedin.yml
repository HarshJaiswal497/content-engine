pillar: lessons
text: 'I wrote 1 test plan for the wrong brand of phone.


  The plan assumed the worst brand for keeping apps alive in the background. Halfway through setup, I mentioned that my test phone was a different one. Same risk category. Different setting names, such as "Allow auto launch" and "Allow background activity". So the plan changed.


  Test on the phone your users actually hold. Write the plan for the worst case first.


  Slipnote is in development. Waitlist:

  https://harshjaiswal497.github.io/content-engine/slipnote/


  #buildinpublic #android #testing'
