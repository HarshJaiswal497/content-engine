text: |
  Six things built my portfolio, and only one is AI.

  Claude wrote the code. GitHub held every release, and Cloudflare put each push live without me touching a server. Lighthouse gave me 2 numbers to chase, 100 on desktop and 82 on phones. And my own phone found every real bug.

  Comment TOOLS and I'll send you the full list, and what each one does.

  #buildwithai #vibecoding #webdev #aicoding #devtools #buildinpublic #indiedev #claude
