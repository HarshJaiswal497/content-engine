text: |
  Three things I'd do differently on my portfolio, and one I'd do the same.

  Differently: test on a real phone from day one. Set up Git and the live deploy before building anything. Settle how long the intro runs early. Every serious bug I hit came from using the site like a visitor, on my own phone and laptop, not from a test.

  The same: decide the facts, the rules and the taste myself, and let AI do the typing.

  I'm open to software developer, backend and AI-native engineering roles. If your team ships like this, I'd love to talk.

  https://portfolio-harsh-jaiswal.pages.dev

  #buildinpublic #aicoding #webdev
